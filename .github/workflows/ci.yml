name: ReviewBot CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-and-tests:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy Type Checking
        run: |
          mypy src demo.py tests

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///test_ci.db
          GITHUB_WEBHOOK_SECRET: ci-secret-12345
        run: |
          pytest --cov=reviewbot --cov-report=term-missing --cov-report=xml -v

      - name: Run Benchmark Evaluation Suite
        run: |
          python eval/run_eval.py
