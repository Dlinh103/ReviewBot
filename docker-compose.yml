version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: reviewbot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reviewbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewbot}
      POSTGRES_DB: ${POSTGRES_DB:-reviewbot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reviewbot} -d ${POSTGRES_DB:-reviewbot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reviewbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewbot-api
    command: uvicorn reviewbot.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-reviewbot}:${POSTGRES_PASSWORD:-reviewbot}@db:5432/${POSTGRES_DB:-reviewbot}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewbot-worker
    command: celery -A reviewbot.worker.celery_app worker -l INFO
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-reviewbot}:${POSTGRES_PASSWORD:-reviewbot}@db:5432/${POSTGRES_DB:-reviewbot}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
